<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vunoh AI Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10">
            <h1 class="text-3xl font-bold text-blue-900">Vunoh AI Assistant</h1>
            <p class="text-gray-600">Bridging the gap for the Kenyan Diaspora.</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <textarea id="userInput" class="w-full p-4 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" rows="3" placeholder="Describe the task you need help with in Kenya..."></textarea>
            <button onclick="submitTask()" id="btnText" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                Process Task
            </button>
        </div>

        <div id="results" class="space-y-4">
            </div>
    </div>

    <script>
        async function submitTask() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('btnText');
            const results = document.getElementById('results');

            if (!input.value) return alert("Please type something!");

            // Loading state
            btn.innerText = "AI is thinking...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/create-task/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({request_text: input.value})
                });

                const data = await response.json();
                
                // Add new card to the top
                const card = `
                    <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-500 animate-fade-in">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded uppercase">${data.ai_analysis.intent}</span>
                            <span class="text-sm font-semibold ${data.ai_analysis.risk_score > 60 ? 'text-red-500' : 'text-green-500'}">Risk Score: ${data.ai_analysis.risk_score}</span>
                        </div>
                        <p class="text-gray-800 font-medium mb-4">"${input.value}"</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                            <div class="p-2 bg-green-50 rounded"><strong>WhatsApp:</strong> ${data.ai_analysis.whatsapp}</div>
                            <div class="p-2 bg-blue-50 rounded"><strong>Email:</strong> ${data.ai_analysis.email}</div>
                            <div class="p-2 bg-yellow-50 rounded"><strong>SMS:</strong> ${data.ai_analysis.sms}</div>
                        </div>
                    </div>
                `;
                results.insertAdjacentHTML('afterbegin', card);
                input.value = "";
            } catch (error) {
                alert("Something went wrong!");
            } finally {
                btn.innerText = "Process Task";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
